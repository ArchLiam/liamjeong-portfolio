<template lwc:render-mode="light">
    <section
        id="experience"
        class="section experience"
        aria-labelledby="experience-title"
    >
        <div class="section__inner slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <h2 id="experience-title" class="section__title">
                    {ui.experience.title}
                </h2>
            </div>
            <!-- role="list": Safari drops list semantics when list-style is none -->
            <ol
                class="timeline slds-col slds-size_1-of-1 slds-large-size_8-of-12"
                role="list"
            >
                <template for:each={roles} for:item="item">
                    <!-- Each piece ends in &#32; so it reads as separate
                         words; a role without known years shows none -->
                    <li key={item.id} class="timeline__item">
                        <template lwc:if={item.period}>
                            <span class="timeline__period"
                                >{item.period}&#32;</span
                            >
                        </template>
                        <!-- Decorative: the company's name sits right beside it -->
                        <template lwc:if={item.logo}>
                            <img
                                class="timeline__logo"
                                src={item.logo}
                                alt=""
                                width="48"
                                height="48"
                                loading="lazy"
                                decoding="async"
                            />
                        </template>
                        <template lwc:else>
                            <span
                                class="timeline__logo timeline__logo_initials"
                                aria-hidden="true"
                                >{item.initials}</span
                            >
                        </template>
                        <span class="timeline__org">{item.org}&#32;</span>
                        <span class="timeline__title">{item.title}&#32;</span>
                        <template lwc:if={item.detail}>
                            <span class="timeline__detail">{item.detail}</span>
                        </template>
                    </li>
                </template>
            </ol>
        </div>
    </section>
</template>
