<template lwc:render-mode="light">
    <section
        id="experience"
        class="section experience"
        aria-labelledby="experience-title"
    >
        <div class="section__inner slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <h2 id="experience-title" class="section__title">
                    {ui.experience.title}
                </h2>
                <p class="experience__credentials">{credentials.summary}</p>
                <template lwc:if={hasVerifyUrl}>
                    <a class="experience__verify" href={credentials.verifyUrl}>
                        {ui.experience.verifyLink}
                    </a>
                </template>
            </div>
            <!-- role="list": Safari drops list semantics when list-style is none -->
            <ol
                class="timeline slds-col slds-size_1-of-1 slds-large-size_8-of-12"
                role="list"
            >
                <template for:each={roles} for:item="item">
                    <li key={item.id} class="timeline__item">
                        <span class="timeline__period">{item.period}</span>
                        <span class="timeline__org">{item.org}</span>
                        <span class="timeline__role">{item.role}</span>
                    </li>
                </template>
            </ol>
        </div>
    </section>
</template>
