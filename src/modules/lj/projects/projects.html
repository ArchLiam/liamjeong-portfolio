<template lwc:render-mode="light">
    <section
        id="projects"
        class="section projects"
        aria-labelledby="projects-title"
    >
        <div class="section__inner">
            <h2 id="projects-title" class="section__title">
                {ui.projects.title}
            </h2>
            <p class="section__lede">{ui.projects.lede}</p>

            <!-- role="list": Safari drops list semantics when list-style is none -->
            <ul class="projects__list" role="list">
                <template for:each={items} for:item="project">
                    <li key={project.id} class="projects__item">
                        <details class="project">
                            <!-- The row is the toggle's name, so each piece
                                 ends in &#32; to read as separate words -->
                            <summary class="project__toggle">
                                <span class="project__heading">
                                    <span class="project__title"
                                        >{project.title}&#32;</span
                                    >
                                    <span class="project__meta"
                                        >{project.meta}&#32;</span
                                    >
                                </span>
                                <span class="project__tags">
                                    <template
                                        for:each={project.tagItems}
                                        for:item="tag"
                                    >
                                        <span
                                            key={tag.key}
                                            class="slds-badge project__tag"
                                            >{tag.label}&#32;</span
                                        >
                                    </template>
                                </span>
                            </summary>
                            <div class="project__body">
                                <p class="project__description">
                                    {project.summary}
                                </p>
                                <template lwc:if={project.hasHighlights}>
                                    <ul class="project__highlights" role="list">
                                        <template
                                            for:each={project.highlightItems}
                                            for:item="highlight"
                                        >
                                            <li key={highlight.key}>
                                                {highlight.text}
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </details>
                    </li>
                </template>
            </ul>
        </div>
    </section>
</template>
