<template lwc:render-mode="light">
    <header class="site-header">
        <div class="site-header__inner">
            <!-- Empty alt: the link's aria-label already names it -->
            <a class="site-header__mark" href="/" aria-label={ui.homeLinkLabel}>
                <img
                    src="/assets/logo/logo-mark.svg"
                    alt=""
                    width="36"
                    height="40"
                />
            </a>
            <nav class="site-header__nav" aria-label={ui.navLabel}>
                <template for:each={ui.nav} for:item="item">
                    <a key={item.href} href={item.href}>{item.label}</a>
                </template>
            </nav>
        </div>
    </header>

    <!-- The layout's skip link targets #main; tabindex lets it take focus -->
    <main id="main" tabindex="-1">
        <lj-hero></lj-hero>

        <lj-recommendations></lj-recommendations>

        <lj-projects></lj-projects>
        <lj-experience></lj-experience>
        <lj-education></lj-education>
        <lj-certifications></lj-certifications>

        <section
            id="contact"
            class="section contact"
            aria-labelledby="contact-title"
        >
            <div class="section__inner contact__inner">
                <!-- Below the fold, so it loads lazily -->
                <img
                    class="contact__photo"
                    src="/assets/img/liam-jeong.webp"
                    alt={ui.contact.photoAlt}
                    width="160"
                    height="160"
                    loading="lazy"
                    decoding="async"
                />
                <div class="contact__text">
                    <h2 id="contact-title" class="contact__title">
                        {profile.availability}
                    </h2>
                    <p class="contact__body">{ui.contact.body}</p>
                    <!-- role="list": Safari drops list semantics when list-style is none -->
                    <ul class="contact__links" role="list">
                        <template for:each={contactLinks} for:item="link">
                            <li key={link.key}>
                                <a
                                    href={link.href}
                                    data-track={link.track}
                                    data-track-from={link.trackFrom}
                                    >{link.label}</a
                                >
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="section__inner site-footer__inner">
            <lj-lockup variant="dark" show-domain></lj-lockup>
            <div class="site-footer__notes">
                <p class="site-footer__legal">
                    {ui.footer.text}&#32;
                    <a href={ui.footer.sourceUrl} data-track={analytics.source}
                        >{ui.footer.sourceLabel}</a
                    >.
                </p>
                <p class="site-footer__statement">
                    {ui.footer.accessibilityText}&#32;
                    <a href={ui.footer.accessibilityUrl}
                        >{ui.footer.accessibilityLabel}</a
                    >.
                </p>
                <p class="site-footer__statement">{ui.footer.privacyText}</p>
            </div>
        </div>
    </footer>
</template>
