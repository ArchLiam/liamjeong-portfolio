<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Liam (LJ) Jeong, Salesforce Architect</title>
        <meta
            name="description"
            content="Liam (LJ) Jeong is a Salesforce Architect who designs and builds Agentforce, OmniStudio, and Data 360 solutions for regulated and public-sector work."
        />
        <meta name="author" content="Liam (LJ) Jeong" />
        <link rel="canonical" href="https://liamjeong.com/" />

        <!-- Link previews (LinkedIn, Slack, iMessage) -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://liamjeong.com/" />
        <meta
            property="og:title"
            content="Liam (LJ) Jeong, Salesforce Architect"
        />
        <meta
            property="og:description"
            content="Agentforce on GovCloud, OmniStudio, Data 360, and the integrations around them."
        />
        <!-- Preview URLs must be absolute -->
        <meta
            property="og:image"
            content="https://liamjeong.com/assets/logo/og.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Liam Jeong, Salesforce Architect"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:image"
            content="https://liamjeong.com/assets/logo/og.png"
        />

        <meta name="theme-color" content="#13233A" />
        <link rel="icon" href="$assetsDir/logo/favicon.ico" sizes="32x32" />
        <link
            rel="icon"
            href="$assetsDir/logo/favicon.svg"
            type="image/svg+xml"
        />
        <link
            rel="apple-touch-icon"
            href="$assetsDir/logo/apple-touch-icon.png"
        />
        <link rel="manifest" href="$assetsDir/site.webmanifest" />

        <!-- Fonts: Bricolage Grotesque (display) + IBM Plex Sans (text) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        />

        <!-- SLDS first, then the site layer so its tokens win -->
        <link
            rel="stylesheet"
            href="$sldsDir/salesforce-lightning-design-system.min.css"
        />
        <link rel="stylesheet" href="$assetsDir/css/site.css" />

        <!-- Marks the page as JS-capable so intro elements can start hidden.
             Without JS (or with reduced motion), everything renders visible. -->
        <script>
            document.documentElement.classList.add('js');
        </script>
    </head>

        <a class="skip-link" href="#main">Skip to content</a>
